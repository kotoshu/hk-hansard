name: spellcheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoshu/action-kotoshu@v2
        with:
          files: "README.md docs scripts"
          language: en
          baseline: .kotoshu-baseline.json
          format: sarif
